# Cowrie configuration for the adaptive-honeypot demo.
#
# Two settings make the adaptive loop work:
#   contents_path  - Cowrie's "operator override cascade": for any file it is
#                    about to serve, <contents_path>/<relpath> wins over the
#                    bundled fs.pickle. HoneyPotFilesystem is built per session,
#                    so planting or removing a file in that directory changes
#                    what the NEXT attacker sees, with no restart.
#   output_jsonlog - writes cowrie.json into the directory the MT3
#                    post_session_pipeline already watches.

[honeypot]
hostname = svr04
timezone = UTC
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
state_path = var/lib/cowrie
etc_path = etc
txtcmds_path = txtcmds

# Host directory bind-mounted by docker-compose; the configurator writes here.
contents_path = /cowrie/honeyfs

# No real backend to proxy to -- this is a pure emulator.
interact_enabled = false

[backend_pool]
enabled = false

[shell]
# filesystem = /cowrie/honeyfs/fs.pickle   # only if you ship a custom tree

[ssh]
enabled = true
# Deliberately old and juicy-looking; also what the schema's Cowrie corpus used.
version = SSH-2.0-OpenSSH_6.0p1 Debian-4+deb7u2
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Off: the demo only routes SSH, and this is one less listener to explain.
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false
