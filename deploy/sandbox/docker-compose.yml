# Cowrie for the internet-facing sandbox. See README.md in this folder.
#
# This is NOT honeypot_dataset/cowrie/docker-compose.yml (that one is the demo: it
# listens on 127.0.0.1 and hides behind the gateway). This one faces the internet.
#
# The paths below are relative to this file. They are the same folders the pipeline
# already uses, so no pipeline setting has to change:
#   honeypot_dataset/cowrie/logs    Cowrie writes cowrie.json here; the pipeline reads it
#   honeypot_dataset/cowrie/honeyfs the pipeline's configurator writes bait here; Cowrie reads it
#
# Start:  docker compose --env-file ./cowrie.env up -d      (see README for cowrie.env)

name: honeypot-sandbox

services:
  cowrie:
    # :latest until the first successful run. Then pin it: verify_sandbox.sh prints the image
    # digest; put it in COWRIE_IMAGE (cowrie/cowrie@sha256:...) so a restart cannot change the version.
    image: ${COWRIE_IMAGE:-cowrie/cowrie:latest}
    container_name: cowrie-sandbox
    restart: unless-stopped
    ports:
      # IPv4 only, on purpose. Docker publishes an IPv6 port through a proxy process, and the
      # container then sees the proxy's address instead of the attacker's. verify_sandbox.sh checks.
      - "${COWRIE_BIND_IP:-0.0.0.0}:${COWRIE_PUBLIC_PORT:-2222}:2222"
    volumes:
      - ../../honeypot_dataset/cowrie/logs:/cowrie/cowrie-git/var/log/cowrie
      - ../../honeypot_dataset/cowrie/honeyfs:/cowrie/honeyfs:ro
      - ./cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - cowrie-state:/cowrie/cowrie-git/var/lib/cowrie        # downloads, tty logs
    networks: [honeypot_net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/cowrie/cowrie-env/bin/python3", "-c",
             "import socket; socket.create_connection(('127.0.0.1', 2222), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  cowrie-state:

networks:
  honeypot_net:
    driver: bridge
    driver_opts:
      # A fixed interface name. egress.nft matches on it to stop anything leaving the honeypot.
      com.docker.network.bridge.name: br-honeypot
    ipam:
      config:
        - subnet: 172.28.0.0/24
