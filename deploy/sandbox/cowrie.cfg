# Cowrie configuration for the internet-facing sandbox.
# Option names were checked against Cowrie's own cowrie.cfg.dist (src/cowrie/data/etc/).
#
# What differs from honeypot_dataset/cowrie/cowrie.cfg (the demo file):
#   * logins     The demo DENIES common passwords so a brute force always looks like one.
#                On the internet that would keep attackers out and we would capture nothing
#                after the login. AuthRandom lets an attacker in after 2-5 different
#                attempts, which keeps the failed-login signal AND the later phases.
#   * forwarding SSH port forwarding is switched off (default is on).
#   * sensor     A fixed name, so every event in cowrie.json says which honeypot saw it.
#
# Keep this file the same in every arm of the study. Change it only on purpose, and log why.

[honeypot]
hostname = svr04
sensor_name = sandbox-cowrie-1
timezone = UTC
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
state_path = var/lib/cowrie
etc_path = etc
txtcmds_path = txtcmds

# The folder the pipeline's configurator writes bait into (bind-mounted by docker-compose.yml).
contents_path = /cowrie/honeyfs

# No real backend. This is a pure emulator.
interact_enabled = false

# Attacker gets in after a random 2-5 different login attempts (min, max, cache size).
auth_class = AuthRandom
auth_class_parameters = 2, 5, 10

# Do not keep huge payloads (bytes). 0 would mean no limit.
download_limit_size = 10485760

[backend_pool]
enabled = false

[ssh]
enabled = true
# Deliberately old-looking; the same banner the demo used.
version = SSH-2.0-OpenSSH_6.0p1 Debian-4+deb7u2
listen_endpoints = tcp:2222:interface=0.0.0.0
forwarding = false
forward_redirect = false
forward_tunnel = false
sftp_enabled = true

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false
