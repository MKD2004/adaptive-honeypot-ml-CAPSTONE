<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Adaptive Honeypot — SOC Console</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of
      // the wrong theme. Keep the storage key in sync with
      // src/hooks/useTheme.jsx's STORAGE_KEY.
      (function () {
        try {
          var stored = localStorage.getItem('honeypot-frontend-theme')
          // The Pulse theme this dashboard uses is designed light-first, so
          // light is the default unless the viewer explicitly chose dark or
          // their OS asks for it.
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {
          /* leave the light default in place */
        }
      })()
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
